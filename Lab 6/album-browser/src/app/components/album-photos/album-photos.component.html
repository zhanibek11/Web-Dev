<h1>Фото альбома #{{ albumId }}</h1>

<p *ngIf="loading">Загрузка...</p>

<div *ngIf="!loading" class="grid">
  <div *ngFor="let photo of photos" class="photo">
    <img [src]="photo.thumbnailUrl" [alt]="photo.title" />
    <p>{{ photo.title }}</p>
  </div>
</div>

<button (click)="goBack()">Назад</button>
